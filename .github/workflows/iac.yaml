name: Terraform Infra

on:
  push:
    branches: [main]
    paths:
      - "iac/**"
      - ".github/workflows/iac.yml"
  pull_request:
    branches: [main]
    paths:
      - "iac/**"
      - ".github/workflows/iac.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write     # required for OIDC -> AWS
  contents: read
  pull-requests: write # required to comment the plan on PRs

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.5"
  TF_WORKING_DIR: iac

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::418300104773:role/hospital-pms-github-deploy-role
          role-session-name: GitHubActionsECSDeployment    

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: tfsec scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ env.TF_WORKING_DIR }}
          severity: CRITICAL,HIGH
          exit-code: "0" # soft fail — review findings without blocking, tighten later

  plan:
    runs-on: ubuntu-latest
    needs: fmt-and-validate
    if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::418300104773:role/hospital-pms-github-deploy-role
          role-session-name: GitHubActionsECSDeployment  
          role-chaining: true

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var="github_repo=${{ github.repository }}" \
            -var="domain_name=${{ vars.DOMAIN_NAME }}" \
            | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8').slice(-60000);
            const body = `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

  apply:
    runs-on: ubuntu-latest
    needs: fmt-and-validate
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event.inputs.action == 'apply'
    # environment: production # requires manual approval if the environment has protection rules configured
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::418300104773:role/hospital-pms-github-deploy-role
          role-session-name: GitHubActionsECSDeployment
          role-chaining: true

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: |
          terraform apply -input=false -auto-approve \
            -var="github_repo=${{ github.repository }}" \
            -var="domain_name=${{ vars.DOMAIN_NAME }}"

      - name: Output infra values
        run: terraform output -json > tf_outputs.json

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: tf_outputs
          path: ${{ env.TF_WORKING_DIR }}/tf_outputs.json
          retention-days: 30

  destroy:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    # environment: production # gate destructive runs behind the same manual approval
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::418300104773:role/hospital-pms-github-deploy-role
          role-session-name: GitHubActionsECSDeployment
          role-chaining: true

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: |
          terraform destroy -input=false -auto-approve \
            -var="github_repo=${{ github.repository }}" \
            -var="domain_name=${{ vars.DOMAIN_NAME }}"
